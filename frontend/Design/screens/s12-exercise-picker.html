<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VULCAN · Exercise picker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/tokens.css">
<link rel="stylesheet" href="shared/base.css">
<link rel="stylesheet" href="shared/components.css">
<link rel="stylesheet" href="shared/shell.css">
<style>
  .pick-row{display:flex;align-items:center;gap:12px;min-height:56px;border-bottom:1px solid var(--border-hairline)}
  .pick-row:last-child{border-bottom:0}
  .pick-row .pn{font-size:var(--fs-body)}
  .pick-row .pm{font-size:var(--fs-caption);color:var(--text-muted)}
  .pick-check{width:26px;height:26px;border-radius:8px;border:1px solid var(--border-hairline);display:grid;place-items:center;color:transparent;flex:none;transition:all 0.2s ease}
  .pick-row.is-sel .pick-check{background:var(--grad-flame);border-color:transparent;color:var(--text-on-accent);box-shadow:var(--shadow-glow-soft)}
  .muscle-filter{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
</style>
</head>
<body>
<div class="app-page" data-od-id="exercise-picker">
  <main class="screen-pad">
    <div class="top-nav">
      <a class="back-btn" href="s09-routine-builder.html" data-od-id="picker-back"><span id="backIco"></span> Builder</a>
      <span class="fs-caption tnum c-muted" id="pickCount">0 selected</span>
    </div>

    <div class="field">
      <input class="field-control" id="exSearch" type="text" placeholder="Search exercises">
    </div>

    <div class="muscle-filter">
      <button class="chip" aria-pressed="true" data-m="All">All</button>
      <button class="chip" aria-pressed="false" data-m="Chest">Chest</button>
      <button class="chip" aria-pressed="false" data-m="Back">Back</button>
      <button class="chip" aria-pressed="false" data-m="Legs">Legs</button>
      <button class="chip" aria-pressed="false" data-m="Shoulders">Shoulders</button>
      <button class="chip" aria-pressed="false" data-m="Arms">Arms</button>
    </div>

    <div class="card" style="padding:6px 14px" data-od-id="exercise-list">
      <button class="spread" style="width:100%;min-height:52px;color:var(--text-primary);text-align:left" data-od-id="btn-custom" id="btnCustom">
        <span class="row" style="gap:8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" style="color:var(--ember-500)"><path d="M12 5v14M5 12h14"/></svg><span style="font-weight:600">Create custom exercise</span></span>
      </button>
      <div id="exList">
        <div class="pick-row" data-name="Bench Press" data-m="Chest"><span class="pn">Bench Press</span><span style="margin-left:auto" class="pm c-secondary">Chest · Barbell</span><span class="pick-check"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span></div>
        <div class="pick-row" data-name="Incline DB Press" data-m="Chest"><span class="pn">Incline DB Press</span><span style="margin-left:auto" class="pm c-secondary">Chest · Dumbbell</span><span class="pick-check"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span></div>
        <div class="pick-row" data-name="Pull-ups" data-m="Back"><span class="pn">Pull-ups</span><span style="margin-left:auto" class="pm c-secondary">Back · Bodyweight</span><span class="pick-check"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span></div>
        <div class="pick-row" data-name="Squat" data-m="Legs"><span class="pn">Squat</span><span style="margin-left:auto" class="pm c-secondary">Legs · Barbell</span><span class="pick-check"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span></div>
        <div class="pick-row" data-name="Lateral Raise" data-m="Shoulders"><span class="pn">Lateral Raise</span><span style="margin-left:auto" class="pm c-secondary">Shoulders · Dumbbell</span><span class="pick-check"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span></div>
        <div class="pick-row" data-name="Skull Crushers" data-m="Arms"><span class="pn">Skull Crushers</span><span style="margin-left:auto" class="pm c-secondary">Triceps · Barbell</span><span class="pick-check"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span></div>
        <div class="pick-row" data-name="Romanian Deadlift" data-m="Legs"><span class="pn">Romanian Deadlift</span><span style="margin-left:auto" class="pm c-secondary">Legs · Barbell</span><span class="pick-check"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span></div>
      </div>
    </div>

    <button class="btn btn-primary" data-full data-od-id="btn-done" id="btnDone" disabled>Done</button>
  </main>
</div>
<script src="shared/icons.js"></script>
<script src="shared/mock-data.js"></script>
<script src="shared/shell.js"></script>
<script>
(function(){
  'use strict';
  document.getElementById('backIco').innerHTML=window.VULCAN_ICONS.icon('arrow-left',{size:18});
  var rows=Array.prototype.slice.call(document.querySelectorAll('.pick-row'));
  var sel={};
  function paint(){
    var n=rows.filter(function(r){return sel[r.getAttribute('data-name')];}).length;
    document.getElementById('pickCount').textContent=n+' selected';
    document.getElementById('btnDone').disabled=n<1;
  }
  rows.forEach(function(r){
    r.style.cursor='pointer';
    r.addEventListener('click',function(){
      var name=r.getAttribute('data-name');
      sel[name]=!sel[name];
      r.classList.toggle('is-sel',!!sel[name]);
      paint();
    });
  });
  document.getElementById('exSearch').addEventListener('input',function(){
    var q=this.value.toLowerCase();
    rows.forEach(function(r){ r.style.display=r.getAttribute('data-name').toLowerCase().indexOf(q)>=0?'':'none'; });
  });
  document.querySelectorAll('[data-m]').forEach(function(c){
    c.addEventListener('click',function(){
      document.querySelectorAll('[data-m]').forEach(function(x){ x.setAttribute('aria-pressed',x===c?'true':'false'); });
      var m=c.getAttribute('data-m');
      rows.forEach(function(r){ r.style.display=(m==='All'||r.getAttribute('data-m')===m)?'':'none'; });
    });
  });
  document.getElementById('btnDone').addEventListener('click',function(){
    var names=rows.filter(function(r){return sel[r.getAttribute('data-name')];}).map(function(r){return r.getAttribute('data-name');});
    try{ localStorage.setItem('vulcan.picked', JSON.stringify(names)); }catch(e){}
    window.OD.toast('Added to routine', names.length>2?names.length+' exercises':names.join(', '),'ember');
    setTimeout(function(){ location.href='s09-routine-builder.html'; },700);
  });
  document.getElementById('btnCustom').addEventListener('click',function(){
    var back=document.createElement('div'); back.className='sheet-backdrop';
    var sh=document.createElement('div'); sh.className='sheet';
    sh.innerHTML='<div class="sheet-handle"></div><div class="sheet-title">Custom exercise</div>'
      +'<div class="field" style="margin-bottom:10px"><label for="cname">Name</label><input class="field-control" id="cname" placeholder="e.g. Landmine press"></div>'
      +'<div class="spread" style="gap:10px"><button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-primary" data-full id="cSave">Save exercise</button></div>';
    back.addEventListener('click',close); sh.querySelector('[data-close]').addEventListener('click',close);
    sh.querySelector('#cSave').addEventListener('click',function(){
      var v=sh.querySelector('#cname').value.trim();
      if(!v){ sh.querySelector('#cname').focus(); return; }
      close(); window.OD.toast('Exercise created', v+' saved to your library.','ember');
    });
    document.body.appendChild(back); document.body.appendChild(sh);
    requestAnimationFrame(function(){ back.classList.add('is-open'); sh.classList.add('is-open'); sh.querySelector('#cname').focus(); });
    function close(){ back.classList.remove('is-open'); sh.classList.remove('is-open'); setTimeout(function(){back.remove();sh.remove();},300); }
  });
})();
</script>
</body>
</html>
