<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VULCAN · Add meal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/tokens.css">
<link rel="stylesheet" href="shared/base.css">
<link rel="stylesheet" href="shared/components.css">
<link rel="stylesheet" href="shared/shell.css">
<style>
  body{background:var(--bg-base)}
  .add-option{display:flex;align-items:center;gap:14px;width:100%;padding:16px;border-radius:var(--r-lg);border:1px solid var(--border-hairline);
    background:var(--bg-card);text-align:left;box-shadow:var(--shadow-card);transition:border-color 0.2s ease}
  .add-option:hover{border-color:#3a3a44}
  .add-option .ao-ico{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;flex:none}
  .add-option.primary .ao-ico{background:var(--grad-flame);color:var(--text-on-accent);box-shadow:var(--shadow-glow)}
  .add-option .ao-ico.alt{background:var(--bg-overlay);color:var(--ember-400)}
  .add-option .ao-title{font-size:var(--fs-body);font-weight:600}
  .add-option .ao-sub{font-size:var(--fs-caption);color:var(--text-muted);margin-top:2px}
  .quick-form{display:flex;flex-direction:column;gap:14px;border-top:1px solid var(--border-hairline);padding-top:18px}
  .inline-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .recent-item{cursor:pointer}
  .recent-item:hover{border-color:#3a3a44}
</style>
</head>
<body>
<div class="sheet" style="transform:translate(-50%,0);position:fixed;top:auto;max-height:94svh;overflow-y:auto" data-od-id="add-meal-sheet">
  <div class="sheet-handle"></div>
  <div class="top-nav" style="margin-bottom:16px">
    <a class="back-btn" href="s16-nutrition-diary.html" data-od-id="add-back"><span id="backIco"></span> Diary</a>
    <div class="fs-h2" style="margin-left:4px">Add to today</div>
  </div>

  <div class="stack" style="gap:10px" data-od-id="add-options">
    <button class="add-option primary" id="optScan" data-od-id="opt-scan">
      <span class="ao-ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></span>
      <span><span class="ao-title">Scan food</span><div class="ao-sub">Photo → AI macros · 5 scans left today</div></span>
      <svg style="margin-left:auto" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" color="#6E6A64"><path d="M9 18l6-6-6-6"/></svg>
    </button>
    <button class="add-option" id="optQuick" data-od-id="opt-quick">
      <span class="ao-ico alt"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg></span>
      <span><span class="ao-title">Quick add</span><div class="ao-sub">Manual kcal + macros</div></span>
    </button>
    <button class="add-option" id="optSearch" data-od-id="opt-search">
      <span class="ao-ico alt"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg></span>
      <span><span class="ao-title">Recent meals</span><div class="ao-sub">Re-log yesterday's food</div></span>
    </button>
  </div>

  <form class="quick-form" id="quickForm" data-od-id="quick-form" hidden>
    <div class="field"><label for="qName">Name</label><input class="field-control" id="qName" placeholder="e.g. Protein shake"></div>
    <div class="inline-grid">
      <div class="field"><label for="qKcal">kcal</label><input class="field-control tnum" id="qKcal" type="number" inputmode="numeric" value="350"></div>
      <div class="field"><label for="qP">protein g</label><input class="field-control tnum" id="qP" type="number" inputmode="numeric" value="35"></div>
      <div class="field"><label for="qC">carbs g</label><input class="field-control tnum" id="qC" type="number" inputmode="numeric" value="30"></div>
      <div class="field"><label for="qF">fat g</label><input class="field-control tnum" id="qF" type="number" inputmode="numeric" value="8"></div>
    </div>
    <button class="btn btn-primary" data-full type="submit" data-od-id="quick-log">Log meal</button>
  </form>

  <div class="stack" style="gap:8px" data-od-id="recent-list" hidden>
    <span class="overline">Recent</span>
    <button class="meal-card recent-item" data-recent="Protein shake">
      <div class="meal-thumb"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 9v6M6 8v8M6 12h12M18 8v8M21 9v6"/></svg></div>
      <div class="meal-body"><span class="meal-name">Protein shake</span><span class="meal-meta tnum">P 35g · C 10g · F 4g</span></div>
      <div class="meal-kcal"><span class="k tnum">230</span><span class="fs-caption c-muted">kcal</span></div>
    </button>
    <button class="meal-card recent-item" data-recent="Eggs & toast">
      <div class="meal-thumb"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 9v6M6 8v8M6 12h12M18 8v8M21 9v6"/></svg></div>
      <div class="meal-body"><span class="meal-name">Scrambled eggs & toast</span><span class="meal-meta tnum">P 26g · C 28g · F 22g</span></div>
      <div class="meal-kcal"><span class="k tnum">420</span><span class="fs-caption c-muted">kcal</span></div>
    </button>
    <button class="meal-card recent-item" data-recent="Apple + peanut butter">
      <div class="meal-thumb"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 9v6M6 8v8M6 12h12M18 8v8M21 9v6"/></svg></div>
      <div class="meal-body"><span class="meal-name">Apple + peanut butter</span><span class="meal-meta tnum">P 7g · C 30g · F 8g</span></div>
      <div class="meal-kcal"><span class="k tnum">220</span><span class="fs-caption c-muted">kcal</span></div>
    </button>
  </div>
</div>

<script src="shared/icons.js"></script>
<script src="shared/mock-data.js"></script>
<script src="shared/shell.js"></script>
<script>
(function(){
  'use strict';
  document.getElementById('backIco').innerHTML=window.VULCAN_ICONS.icon('arrow-left',{size:18});
  var KEY='vulcan.diary';
  function load(){ try{ return JSON.parse(localStorage.getItem(KEY)||'null'); }catch(e){ return null; } }
  function save(o){ try{ localStorage.setItem(KEY,JSON.stringify(o)); }catch(e){} }
  function addMeal(m){
    var d=load()||{meals:[]};
    m.id=(Date.now()%100000);
    m.meal=m.meal||'Snacks';
    d.meals.push(m); save(d);
    window.OD.toast('Meal logged', m.name+' · '+m.kcal+' kcal','ember');
    setTimeout(function(){ location.href='s16-nutrition-diary.html'; },700);
  }

  document.getElementById('optScan').addEventListener('click',function(){ location.href='s18-scan-camera.html'; });
  document.getElementById('optQuick').addEventListener('click',function(){
    document.getElementById('quickForm').hidden=!document.getElementById('quickForm').hidden;
    if(!document.getElementById('quickForm').hidden){ document.getElementById('qName').focus(); }
  });
  document.getElementById('optSearch').addEventListener('click',function(){
    document.getElementById('recent-list').hidden=!document.getElementById('recent-list').hidden;
  });

  document.getElementById('quickForm').addEventListener('submit',function(e){
    e.preventDefault();
    var name=document.getElementById('qName').value.trim();
    if(!name){ document.getElementById('qName').focus(); return; }
    addMeal({name:name, kcal:+document.getElementById('qKcal').value||0, p:+document.getElementById('qP').value||0,
      c:+document.getElementById('qC').value||0, f:+document.getElementById('qF').value||0});
  });

  var RECENTS={
    'Protein shake':{kcal:230,p:35,c:10,f:4},
    'Eggs & toast':{kcal:420,p:26,c:28,f:22},
    'Apple + peanut butter':{kcal:220,p:7,c:30,f:8}
  };
  document.querySelectorAll('[data-recent]').forEach(function(b){
    b.addEventListener('click',function(){ var r=RECENTS[b.getAttribute('data-recent')]; addMeal({name:b.getAttribute('data-recent'),kcal:r.kcal,p:r.p,c:r.c,f:r.f}); });
  });
})();
</script>
</body>
</html>
