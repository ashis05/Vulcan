<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VULCAN · Welcome</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/tokens.css">
<link rel="stylesheet" href="shared/base.css">
<link rel="stylesheet" href="shared/components.css">
<style>
  body{background:var(--bg-base)}
  body::before{content:"";position:fixed;inset-inline:0;bottom:-2px;height:56vh;z-index:0;pointer-events:none;
    background:radial-gradient(120% 100% at 50% 110%,rgba(255,106,0,0.16),transparent 62%)}
  .screen{width:min(100%,440px);margin-inline:auto;min-height:100svh;position:relative;z-index:1;
    display:flex;flex-direction:column;padding:max(28px,env(safe-area-inset-top)) 22px max(28px,env(safe-area-inset-bottom))}
  .word-top{flex:0 1 34%;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:10px}
  .wordname{display:flex;align-items:center;gap:12px;font-family:var(--font-display);font-weight:700;font-size:var(--fs-h2);letter-spacing:-0.03em}
  .wordname svg{color:var(--ember-500)}
  .spacer{flex:1}
  .welcome-h1{font-family:var(--font-display);font-weight:700;font-size:var(--fs-display);line-height:var(--lh-display);letter-spacing:var(--ls-display);text-align:center}
  .welcome-cap{text-align:center;color:var(--text-secondary);margin-top:12px}
  .cta-wrap{display:flex;flex-direction:column;gap:12px;margin-top:28px}
  .g-badge{width:22px;height:22px;border-radius:50%;background:#fff;color:#111;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
  .terms{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;margin-top:18px;text-align:center;font-size:var(--fs-caption);color:var(--text-muted)}
  .terms a{color:var(--text-secondary)}
</style>
</head>
<body>
<div class="screen" data-od-id="welcome-screen">
  <div class="word-top">
    <div class="wordname" data-od-id="welcome-wordmark"><span id="wmark"></span>VULCAN</div>
    <div style="height:44px" aria-hidden="true"></div>
  </div>
  <div class="spacer"></div>
  <div>
    <div style="display:flex;flex-direction:column;align-items:center">
      <h1 class="welcome-h1" data-od-id="welcome-hero">Forge your<br>physique.</h1>
      <p class="welcome-cap fs-body">AI coaching. Training. Nutrition.<br>One forge.</p>
    </div>
    <div class="cta-wrap">
      <button class="btn btn-primary" data-full id="btn-google" data-od-id="btn-google">
        <span class="g-badge">G</span>Continue with Google
      </button>
      <a class="btn btn-secondary" data-full href="s03-login.html" data-od-id="btn-email">Continue with email</a>
    </div>
    <p class="terms">By continuing you agree to the <a href="#">Terms</a> &amp; <a href="#">Privacy Policy</a>.</p>
  </div>
</div>
<script src="shared/icons.js"></script>
<script>
  document.getElementById('wmark').innerHTML = window.VULCAN_ICONS.icon('spark',{filled:true,size:22});
  document.getElementById('btn-google').addEventListener('click',function(){
    try{ localStorage.setItem('vulcan.user', JSON.stringify({name:'Marcus', goal:'Cut · −0.5 kg/wk'})); }catch(e){}
    location.href='s06-today.html';
  });
</script>
</body>
</html>
