<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VULCAN · Food scan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/tokens.css">
<link rel="stylesheet" href="shared/base.css">
<link rel="stylesheet" href="shared/components.css">
<link rel="stylesheet" href="shared/shell.css">
<style>
  body{background:#000}
  .scan{width:min(100%,var(--app-max));margin-inline:auto;height:100svh;display:flex;flex-direction:column}
  .scan-top{display:flex;align-items:center;justify-content:space-between;padding:max(12px,env(safe-area-inset-top)) 16px 10px;position:relative;z-index:5}
  .scan-top .back-btn{color:var(--text-secondary)}
  .cam-wrap{flex:1;position:relative;overflow:hidden}
  .plate-ghost{position:absolute;left:50%;top:52%;transform:translate(-50%,-70%);width:48%;aspect-ratio:1;border-radius:50%;
    border:2px dashed rgba(255,255,255,0.14);display:grid;place-items:center;color:rgba(255,106,0,0.55)}
  .plate-ghost svg{width:55%;height:55%}
  .scan-foot{flex:none;padding:18px 16px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
  .foot-row{display:flex;align-items:center;gap:14px}
  .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:9}
  .flash.on{animation:flashAnim 0.5s ease-out}
  @keyframes flashAnim{0%{opacity:.85}100%{opacity:0}}
  .frame-corner{position:absolute;width:22px;height:22px;border-color:rgba(255,106,0,0.9);border-style:solid;border-width:3px}
  .camera-view::before{content:"";position:absolute;inset:0;background:
    radial-gradient(60% 50% at 50% 42%,rgba(120,90,60,0.14),transparent 70%),
    linear-gradient(180deg,transparent,rgba(0,0,0,0.5))}
</style>
</head>
<body>
<div class="scan" data-od-id="scan-camera">
  <div class="scan-top">
    <a class="back-btn" href="s17-add-meal.html" data-od-id="scan-back"><span id="backIco"></span> Add meal</a>
    <span class="fs-caption c-muted">FLAT LAY · WHOLE PLATE</span>
  </div>
  <div class="cam-wrap" data-od-id="scan-viewport">
    <div class="camera-view" style="height:100%;aspect-ratio:auto;border-radius:0">
      <div class="plate-ghost"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/></svg></div>
      <div class="frame-corner" style="top:40px;left:40px;border-right:0;border-bottom:0"></div>
      <div class="frame-corner" style="top:40px;right:40px;border-left:0;border-bottom:0"></div>
      <div class="frame-corner" style="bottom:86px;left:40px;border-right:0;border-top:0"></div>
      <div class="frame-corner" style="bottom:86px;right:40px;border-left:0;border-top:0"></div>
      <div class="camera-hint">Plate in frame for a cleaner read</div>
    </div>
  </div>
  <div class="scan-foot">
    <div class="foot-row">
      <button class="btn btn-ghost btn-icon" data-od-id="scan-mini-gallery" aria-label="Gallery" style="color:var(--text-secondary)">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
      </button>
      <div style="flex:1;display:grid;place-items:center">
        <button class="shutter" id="shutter" data-od-id="shutter" aria-label="Capture"></button>
      </div>
      <button class="btn btn-ghost btn-icon" data-od-id="scan-flip" aria-label="Flip camera" style="color:var(--text-secondary)">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-14.9-6.5L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 14.9 6.5L21 16"/><path d="M21 21v-5h-5"/></svg>
      </button>
    </div>
    <p class="fs-caption c-muted" style="text-align:center">2 of 5 scans left today · the forge cools at midnight</p>
  </div>
  <div class="flash" id="flash"></div>
</div>
<script src="shared/icons.js"></script>
<script src="shared/mock-data.js"></script>
<script src="shared/shell.js"></script>
<script>
(function(){
  document.getElementById('backIco').innerHTML=window.VULCAN_ICONS.icon('arrow-left',{size:18});
  var capture=false;
  document.getElementById('shutter').addEventListener('click',function(){
    if(capture) return; capture=true;
    var f=document.getElementById('flash'); f.classList.add('on');
    setTimeout(function(){ location.href='s19-ai-food-confirm.html'; }, 850);
  });
  document.querySelectorAll('[data-od-id="scan-mini-gallery"],[data-od-id="scan-flip"]').forEach(function(b){
    b.addEventListener('click',function(){ window.OD.toast('Camera control','Unavailable in the prototype.',''); });
  });
})();
</script>
</body>
</html>
