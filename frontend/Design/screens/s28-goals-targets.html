<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VULCAN · Goals & targets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/tokens.css">
<link rel="stylesheet" href="shared/base.css">
<link rel="stylesheet" href="shared/components.css">
<link rel="stylesheet" href="shared/shell.css">
<style>
  .target-big{border:1px solid var(--border-hairline);border-radius:var(--r-md);background:var(--bg-card);padding:14px;text-align:center;display:flex;flex-direction:column;gap:4px}
  .target-big .v{font-family:var(--font-display);font-weight:700;font-size:var(--fs-title);font-variant-numeric:tabular-nums;line-height:1}
  .add-row{display:flex;justify-content:space-between;align-items:center;min-height:48px;border-bottom:1px solid var(--border-hairline)}
  .add-row:last-child{border-bottom:0}
</style>
</head>
<body>
<div class="app-page" data-od-id="goals-targets">
  <main class="screen-pad">
    <div class="top-nav">
      <a class="back-btn" href="s27-profile.html" data-od-id="goals-back"><span id="backIco"></span> Profile</a>
      <div class="fs-h2" style="margin-left:4px">Goals &amp; targets</div>
    </div>

    <div class="card spread" data-od-id="current-goal">
      <div class="stack-sm">
        <span class="fs-label c-secondary">Current goal</span>
        <span class="chip" aria-pressed="true" style="align-self:flex-start;color:var(--ember-400)">Cut · −0.5 kg/wk</span>
        <span class="fs-caption c-muted tnum">82.4 kg · on plan since Jun</span>
      </div>
      <span class="streak is-lit"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg><span class="streak-font tnum">47</span></span>
    </div>

    <div class="card" data-od-id="computed-targets">
      <span class="overline" style="display:block;margin-bottom:12px">Computed targets</span>
      <div class="grid2">
        <div class="target-big" data-od-id="target-kcal"><span class="v tnum" id="tKcal">2,140</span><span class="fs-caption c-muted">kcal / day</span></div>
        <div class="target-big" data-od-id="target-protein"><span class="v tnum" id="tP">164</span><span class="fs-caption c-muted">protein g</span></div>
        <div class="target-big"><span class="v tnum" id="tC">250</span><span class="fs-caption c-muted">carbs g</span></div>
        <div class="target-big"><span class="v tnum" id="tF">66</span><span class="fs-caption c-muted">fat g</span></div>
      </div>
      <div class="add-row" style="margin-top:12px"><span class="fs-body">Macro split</span><span class="tnum c-secondary">30% P · 47% C · 28% F</span></div>
      <div class="add-row"><span class="fs-body">Steps budget</span><span class="tnum c-secondary">10,000 · +16% pace</span></div>
      <button class="btn btn-ghost btn-sm" data-full style="margin-top:10px" data-od-id="btn-recalc" id="btnRecalc">Recalculate from latest weight</button>
    </div>

    <div class="card" data-od-id="change-goal">
      <span class="overline" style="display:block;margin-bottom:10px">Change goal</span>
      <div class="row" style="gap:6px">
        <button class="chip" aria-pressed="false" data-g="Cut">Cut</button>
        <button class="chip" aria-pressed="false" data-g="Recomp">Recomp</button>
        <button class="chip" aria-pressed="false" data-g="Maintain">Maintain</button>
        <button class="chip" aria-pressed="false" data-g="Bulk">Bulk</button>
      </div>
    </div>
  </main>
</div>
<script src="shared/icons.js"></script>
<script src="shared/mock-data.js"></script>
<script src="shared/shell.js"></script>
<script>
(function(){
  document.getElementById('backIco').innerHTML=window.VULCAN_ICONS.icon('arrow-left',{size:18});
  document.getElementById('btnRecalc').addEventListener('click',function(){
    var k=Math.round(2140+(Math.random()*40-20));
    document.getElementById('tKcal').textContent=k.toLocaleString();
    window.OD.toast('Targets recalculated', 'From 82.4 kg · '+k.toLocaleString()+' kcal','ember');
  });
  document.querySelectorAll('[data-g]').forEach(function(c){
    c.addEventListener('click',function(){
      document.querySelectorAll('[data-g]').forEach(function(x){ x.setAttribute('aria-pressed',x===c?'true':'false'); });
      var g=c.getAttribute('data-g');
      var back=document.createElement('div'); back.className='sheet-backdrop';
      var sh=document.createElement('div'); sh.className='sheet';
      sh.innerHTML='<div class="sheet-handle"></div><div class="sheet-title">Switch to '+g+'?</div>'
        +'<p class="sheet-body">Targets recompute and the active program reweights over the next two sessions.</p>'
        +'<div class="spread" style="gap:10px"><button class="btn btn-ghost" data-close>Keep cut</button><button class="btn btn-primary" data-full data-close>Switch to '+g+'</button></div>';
      back.addEventListener('click',close); sh.querySelectorAll('[data-close]').forEach(function(b){ b.addEventListener('click',function(){ close(); window.OD.toast('Goal changed','Now '+g+'.'); }); });
      document.body.appendChild(back); document.body.appendChild(sh);
      requestAnimationFrame(function(){ back.classList.add('is-open'); sh.classList.add('is-open'); });
      function close(){ back.classList.remove('is-open'); sh.classList.remove('is-open'); setTimeout(function(){back.remove();sh.remove();},300); }
    });
  });
})();
</script>
</body>
</html>
