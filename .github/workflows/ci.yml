name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Settings() requires SUPABASE_URL; tests mock all I/O so a placeholder is fine.
      SUPABASE_URL: https://ci.supabase.co
      QUOTA_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Compile check
        run: python -m compileall -q app
      - name: Run tests
        run: python -m pytest -q

  frontend:
    name: Frontend (tsc, lint, vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # Client-safe placeholders so module-level env checks resolve in CI.
      EXPO_PUBLIC_SUPABASE_URL: https://ci.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      EXPO_PUBLIC_API_URL: https://api-vulcan.ashiswadhwani.in
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test

  docker:
    name: Backend image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t vulcan-api:ci ./backend
